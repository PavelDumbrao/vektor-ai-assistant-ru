name: Passive Secretary release contract

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/04-passive-secretary.md"
      - "docs/05-troubleshooting.md"
      - "hermes-agent/plugins/platforms/telegram/passive_updates.py"
      - "hermes-agent/plugins/platforms/telegram/adapter.py"
      - "hermes-agent/telegram_business_rights.py"
      - "modules/passive-secretary/**"
      - "tests/test_*.py"
      - ".github/workflows/passive-secretary-release.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/04-passive-secretary.md"
      - "docs/05-troubleshooting.md"
      - "hermes-agent/plugins/platforms/telegram/passive_updates.py"
      - "hermes-agent/plugins/platforms/telegram/adapter.py"
      - "hermes-agent/telegram_business_rights.py"
      - "modules/passive-secretary/**"
      - "tests/test_*.py"
      - ".github/workflows/passive-secretary-release.yml"

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Compile release modules
        run: |
          python -m py_compile \
            modules/passive-secretary/install_passive_secretary.py \
            modules/passive-secretary/install_core_patch.py \
            modules/passive-secretary/manage_passive_secretary.py \
            modules/passive-secretary/passive_secretary_plugin/*.py \
            modules/passive-secretary/hermes-core-patch/telegram_business_rights.py \
            modules/passive-secretary/hermes-core-patch/plugins/platforms/telegram/passive_updates.py \
            hermes-agent/telegram_business_rights.py \
            hermes-agent/plugins/platforms/telegram/passive_updates.py
      - name: Verify install bundle and outbound gates
        run: python -m unittest discover -s tests -p 'test_*.py' -v
