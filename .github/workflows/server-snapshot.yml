name: Server snapshot

on:
  pull_request:
    paths: ["server/**", "modules/**", "scripts/check_public_bundle.py", "tests/**", ".github/workflows/server-snapshot.yml"]
  push:
    branches: [main]
    paths: ["server/**", "modules/**", "scripts/check_public_bundle.py", "tests/**", ".github/workflows/server-snapshot.yml"]

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/server-requirements.txt
      - name: Check public source boundary and checksums
        run: python scripts/check_public_bundle.py
      - name: Focus and profile tools
        env:
          PYTHONPATH: hermes-agent
        run: python -m pytest modules/focus-assistant/tests modules/profile-tools/tests -q
      - name: AI Fixer
        env:
          PYTHONPATH: modules/ai-fixer-social/src
        run: python -m unittest discover -s modules/ai-fixer-social/tests -q
      - name: Compile new program sources
        run: python -m compileall -q modules/focus-assistant modules/ai-fixer-social modules/maton-legacy modules/profile-tools

  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Obtain the checksum-pinned official source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 10 --max-time 180 \
            https://github.com/PavelDumbrao/vektor-ai-assistant-ru/releases/download/hermes-vps-2026.09.08/upstream-0.21.0.tar.gz \
            --output "$RUNNER_TEMP/hermes-source.tar.gz"
      - name: Reconstruct both VPS source variants
        run: |
          python modules/shared-runtime/verify_release_source.py --archive "$RUNNER_TEMP/hermes-source.tar.gz" --variant modern --output "$RUNNER_TEMP/hermes-modern"
          python modules/shared-runtime/verify_release_source.py --archive "$RUNNER_TEMP/hermes-source.tar.gz" --variant legacy --output "$RUNNER_TEMP/hermes-legacy"
