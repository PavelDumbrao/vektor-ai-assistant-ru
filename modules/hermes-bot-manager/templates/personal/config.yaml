model:
  provider: custom
  base_url: https://lingsuan.top/v1
  default: gpt-6.1-sol
  api_key: ${LLM_API_KEY}
  context_length: 180000
providers:
  lingsuan-vision:
    api: https://lingsuan.top/v1
    key_env: LLM_API_KEY
    transport: chat_completions
    models:
      gpt-5.6-sol:
        supports_vision: true
      gpt-6.1-sol:
        supports_vision: true
  lingsuan-terra-vision:
    api: https://lingsuan.top/v1
    key_env: FALLBACK_LLM_API_KEY
    transport: chat_completions
    models:
      gpt-5.6-terra:
        supports_vision: true
  lingsuan-gemini-vision:
    api: https://lingsuan.top/v1
    key_env: GEMINI_LLM_API_KEY
    transport: chat_completions
    models:
      gemini-3.8-flash-medium:
        supports_vision: true
fallback_providers:
- provider: custom
  model: claude-opus-5-5
  base_url: https://api.lingsuan.si/v1
  key_env: LINGSUAN_OPUS_KEY
- provider: custom
  model: glm-5.3
  base_url: https://api.unorouter.com/v1
  key_env: UNOROUTER_API_KEY
- provider: custom
  model: gpt-5.6-terra
  base_url: https://lingsuan.top/v1
  key_env: FALLBACK_LLM_API_KEY
max_concurrent_sessions: 2
max_live_sessions: 4
agent:
  max_turns: 60
  api_max_retries: 1
  gateway_timeout: 1800
  verbose: false
  reasoning_effort: medium
  disabled_toolsets:
  - browser-cdp
  - computer_use
  - delegation
  - discord
  - discord_admin
  - feishu_doc
  - feishu_drive
  - homeassistant
  - project
  - terminal
  - video
  - video_gen
  - passive_secretary_outbound
auxiliary:
  vision:
    provider: lingsuan-vision
    model: gpt-6.1-sol
    timeout: 45
    fallback_chain:
    - provider: lingsuan-terra-vision
      model: gpt-5.6-terra
      timeout: 45
    - provider: lingsuan-gemini-vision
      model: gemini-3.8-flash-medium
      timeout: 45
terminal:
  backend: local
  cwd: /home/@OWNER@/workspace
  timeout: 180
  home_mode: auto
approvals:
  mode: 'off'
  timeout: 300
  cron_mode: approve
  deny:
  - rm -rf /*
  - git push --force*
  single_query_mode: approve
  unattended_mode: approve
command_allowlist: []
skills:
  guard_agent_created: true
  write_approval: false
curator:
  enabled: false
kanban:
  dispatch_in_gateway: false
memory:
  nudge_interval: 0
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 4000
  user_char_limit: 6000
  provider: ''
stt:
  enabled: true
  provider: openrouter_whisper
  language: ru
  openrouter:
    model: openai/whisper-large-v3-turbo
    fallback_models:
    - microsoft/mai-transcribe-2
    - openai/whisper-large-v3
    timeout: 30
voice:
  auto_tts: false
search:
  provider: tavily
web:
  search_backend: tavily
  extract_backend: tavily
timezone: Europe/Moscow
display:
  language: ru
  busy_input_mode: queue
  busy_ack_enabled: true
  platforms:
    telegram:
      streaming: true
      tool_progress: all
      tool_progress_grouping: accumulate
      interim_assistant_messages: false
      thinking_progress: false
      long_running_notifications: generic
      cleanup_progress: true
gateway:
  delivery_ledger: true
  platform_connect_timeout: 60
platforms:
  telegram:
    enabled: true
    unauthorized_dm_behavior: ignore
    home_channel:
      platform: telegram
      chat_id: '@OWNER_TELEGRAM_ID@'
      name: Owner
    extra:
      allow_admin_from:
      - '@OWNER_TELEGRAM_ID@'
      - '@TECH_ADMIN_TELEGRAM_ID@'
      user_allowed_commands:
      - start
      - help
      - status
      - new
      - reset
      - retry
      - undo
      - title
      - resume
      - sessions
      - usage
      - voice
      - memory
      - context
      - compress
      - whoami
      - golos
      command_menu:
        max_commands: 16
        priority_mode: replace
        priority:
        - golos
        - help
        - new
        - status
        - resume
        - sessions
        - retry
        - undo
        - title
        - context
        - compress
        - usage
        - voice
        - memory
        - whoami
      business_updates_mode: passive
      business_owner_ids:
      - '@OWNER_TELEGRAM_ID@'
      business_reply_enabled: false
      passive_media_enabled: true
      passive_media_asr_provider: openrouter
      group_passive_enabled: true
      group_passive_chat_ids: []
network:
  force_ipv4: true
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
telemetry:
  shared_metrics:
    enabled: true
updates:
  pre_update_backup: quick
  backup_keep: 5
  non_interactive_local_changes: stash
plugins:
  enabled: []
  disabled: []
goals:
  max_turns: 5
_config_version: 33
mcp_servers:
  proaisaver:
    enabled: true
    url: https://saver-mcp.proaicommunity.online/mcp/
    headers:
      Authorization: Bearer
    connect_timeout: 30
    timeout: 300
    skip_preflight: true
    tools:
      include:
      - inspect_media
      - inspect_collection
      - download_media
      - transcribe_media
      - transform_content
      - get_job
      - get_artifact_info
      - cancel_job
hooks:
  post_tool_call:
  - command: /home/@OWNER@/.hermes/hermes-agent/venv/bin/python /home/@OWNER@/.hermes/hooks/clean-docmeta.py
    timeout: 30
tts:
  provider: elevenlabs
  elevenlabs:
    voice_id: rQOBu7YxCDxGiFdTm28w
    model_id: eleven_v4_turbo
