set_real_ip_from 172.18.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=forge_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=forge_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=forge_zoom_limit:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    location /v1/auth/telegram {
        limit_req zone=forge_auth_limit burst=10 nodelay;
        proxy_pass http://host.docker.internal:8650;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v1/webhooks/zoom {
        limit_req zone=forge_zoom_limit burst=20 nodelay;
        proxy_pass http://host.docker.internal:8650;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        limit_req zone=forge_api_limit burst=40 nodelay;
        proxy_pass http://host.docker.internal:8650;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
