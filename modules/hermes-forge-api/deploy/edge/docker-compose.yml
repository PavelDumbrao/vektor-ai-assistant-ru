name: hermes-forge-edge

services:
  edge:
    image: nginx:1.27-alpine
    container_name: hermes-forge-edge
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.hermes-forge.rule=Host(`${FORGE_HOSTNAME}`)"
      - "traefik.http.routers.hermes-forge.entrypoints=websecure"
      - "traefik.http.routers.hermes-forge.tls=true"
      - "traefik.http.routers.hermes-forge.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.hermes-forge.middlewares=hermes-forge-secure@docker"
      - "traefik.http.services.hermes-forge.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.hermes-forge-secure.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hermes-forge-secure.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hermes-forge-secure.headers.stsPreload=true"
      - "traefik.http.middlewares.hermes-forge-secure.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.hermes-forge-secure.headers.referrerPolicy=no-referrer"

networks:
  n8n_default:
    external: true
