limit_req_zone $binary_remote_addr zone=forge_api_limit:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    location / {
        limit_req zone=forge_api_limit burst=40 nodelay;
        proxy_pass http://host.docker.internal:8650;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
