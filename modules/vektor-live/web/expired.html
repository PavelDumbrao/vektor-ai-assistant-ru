<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ссылка недействительна</title>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --line: #262a34; --text: #e8eaf0; --muted: #8f97a8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
          padding: 28px; max-width: 420px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Ссылка недействительна</h1>
    <p>Она уже истекла или была открыта слишком давно.</p>
    <p>Попросите ВЕКТОРА прислать новую ссылку в Telegram.</p>
  </div>
</body>
</html>
