schema: hermes.capability/v1
id: google-workspace
name: Google Workspace
version: 1.0.0
publisher: Hermes Official
trust_tier: official
availability: planned
kind: connector
summary: Direct Gmail, Calendar and Drive connection managed by Forge.
runtime: ">=0.21,<0.22"
connection:
  mode: oauth
  secret_names: []
  oauth_scopes: [gmail.readonly, calendar.readonly, drive.readonly]
permissions:
  network: external_api
  filesystem: tenant_config
  action_default: approval
health:
  operation: none
provision:
  install: none
  uninstall: none
retention: tenant_private
metering: none
