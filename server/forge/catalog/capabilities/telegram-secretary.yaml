schema: hermes.capability/v1
id: telegram-secretary
name: Telegram Secretary
version: 1.0.0
publisher: Hermes Official
trust_tier: official
availability: available
kind: plugin
summary: Passive Telegram context capture and private recall for the owner.
runtime: ">=0.21,<0.22"
connection:
  mode: telegram
  secret_names: []
  oauth_scopes: []
permissions:
  network: platform
  filesystem: tenant_workspace
  action_default: observe
health:
  operation: telegram-secretary-ready
provision:
  install: ensure-telegram-secretary
  uninstall: disable-telegram-secretary
retention: tenant_private
metering: none
